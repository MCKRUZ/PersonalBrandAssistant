# Production overlay for the Mac Mini deployment.
#
# Run with the base file, NOT the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# On the Mac Mini this is pinned via COMPOSE_FILE in .env, so a bare
# `docker compose up -d` (and reboots) always uses base + prod.
#
# vs docker-compose.override.yml (local dev): web is the real nginx build (not
# ng serve), the API runs in Production, no source mounts, no dev-only ports.
services:
  web:
    build:
      context: src/PersonalBrandAssistant.Web
      dockerfile: Dockerfile          # nginx multi-stage prod build (serves SPA + proxies /api, /hubs)
    ports:
      - "4201:80"                     # Tailscale serve routes / -> localhost:4201

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Blog publishing: in-container `git push` to the matthewkruczek-ai repo.
      BlogConnector__RepoPath: /app/blog-repo
      BlogConnector__Author: Matthew Kruczek
      GIT_SSH_COMMAND: "ssh -i /app/secrets/mk_ai_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/gh_known_hosts"
      # Multi-platform publishing (binds LinkedInOptions "Publishing:LinkedIn").
      Publishing__LinkedIn__Enabled: "true"
      Publishing__LinkedIn__ClientId: ${LINKEDIN_CLIENT_ID:-}
      Publishing__LinkedIn__ClientSecret: ${LINKEDIN_CLIENT_SECRET:-}
      Publishing__LinkedIn__RedirectUri: ${LINKEDIN_REDIRECT_URI:-http://localhost:5001/api/auth/linkedin/callback}
      # TikTok publishing via Buffer (transport) + Cloudflare R2 (media hosting). Buffer fetches the
      # video from the bucket's public custom domain (media.matthewkruczek.ai), so both must be
      # configured together.
      Publishing__Buffer__Enabled: "true"
      Publishing__Buffer__ApiKey: ${BUFFER_API_KEY:-}
      Media__R2__Enabled: "true"
      Media__R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      Media__R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      Media__R2__Endpoint: https://122c54305bb75c93b4ad2eeb5e616d79.r2.cloudflarestorage.com
      # Instagram Reels publishing. Reuses the same R2 host above — Meta also fetches media by URL
      # rather than accepting bytes. IgUserId is @matthewkruczek.ai; Meta's publishing endpoints are
      # rooted at /{ig-user-id}/ and do not accept a handle. The token is NOT here: it lives as an
      # encrypted Publishing credential in the database, seeded via POST /api/platforms/instagram/credentials.
      Publishing__Instagram__Enabled: "true"
      Publishing__Instagram__IgUserId: ${IG_USER_ID:-17841446031323328}
      # YouTube uploading. Same Google app as the analytics OAuth below — a SEPARATE credential in
      # the database, scoped to upload rather than read, seeded by consenting once at
      # /api/auth/youtube/authorize?purpose=publishing. No token here: it rotates.
      #
      # An upload costs 1,600 of Google's 10,000-unit daily quota, shared with the analytics polling
      # against this same project. Four a day leaves headroom; raise it only if the quota is raised.
      Publishing__YouTubeUpload__Enabled: "true"
      # The channel uploads must land on: @matthewkruczek. Consent grants whichever channel was
      # picked in Google's chooser, and this account owns a SECOND channel with the same display
      # name (@mattkruczek2665) — the first test upload went there, valid credential and all.
      Publishing__YouTubeUpload__ChannelId: ${YOUTUBE_CHANNEL_ID:-UCZ3-8txSHf0tsTbrm98p8_w}
      Publishing__YouTubeUpload__DailyUploadBudget: ${YOUTUBE_DAILY_UPLOAD_BUDGET:-4}
      # Channel analytics OAuth (binds *OAuthOptions "Publishing:{Platform}") + per-platform gates.
      Publishing__YouTube__ClientId: ${YOUTUBE_CLIENT_ID:-}
      Publishing__YouTube__ClientSecret: ${YOUTUBE_CLIENT_SECRET:-}
      Publishing__YouTube__ApiKey: ${YOUTUBE_API_KEY:-}
      Publishing__YouTube__RedirectUri: ${YOUTUBE_REDIRECT_URI:-}
      # TikTok analytics reads through a SANDBOX app (client key is sbaw-prefixed). A sandbox needs no
      # TikTok app review, but only accounts registered as its target users can authorize it.
      Publishing__TikTok__ClientId: ${TIKTOK_CLIENT_KEY:-}
      Publishing__TikTok__ClientSecret: ${TIKTOK_CLIENT_SECRET:-}
      Publishing__TikTok__RedirectUri: ${TIKTOK_REDIRECT_URI:-}
      ChannelAnalytics__YouTubeEnabled: ${YOUTUBE_ANALYTICS_ENABLED:-false}
      ChannelAnalytics__InstagramEnabled: ${INSTAGRAM_ANALYTICS_ENABLED:-false}
      ChannelAnalytics__TikTokEnabled: ${TIKTOK_ANALYTICS_ENABLED:-false}
      PlatformIntegrations__Reddit__ClientId: ${REDDIT_CLIENT_ID:-}
      PlatformIntegrations__Reddit__ClientSecret: ${REDDIT_CLIENT_SECRET:-}
      PlatformIntegrations__Reddit__Username: ${REDDIT_USERNAME:-}
      PlatformIntegrations__Reddit__Password: ${REDDIT_PASSWORD:-}
      PlatformIntegrations__Reddit__UserAgent: ${REDDIT_USER_AGENT:-pba/1.0}
      PlatformIntegrations__LinkedIn__ClientId: ${LINKEDIN_CLIENT_ID:-}
      PlatformIntegrations__LinkedIn__ClientSecret: ${LINKEDIN_CLIENT_SECRET:-}
      # OAuth callback URLs: preserved from prior config. Updating to the Tailscale
      # host requires registering matching redirect URIs in each platform's app first.
      PlatformIntegrations__Twitter__CallbackUrl: http://localhost:4201/platforms/twitter/callback
      PlatformIntegrations__LinkedIn__CallbackUrl: http://localhost:4201/platforms/linkedin/callback
      PlatformIntegrations__Instagram__CallbackUrl: http://localhost:4201/platforms/instagram/callback
      PlatformIntegrations__YouTube__CallbackUrl: http://localhost:4201/platforms/youtube/callback
      GoogleAnalytics__CredentialsPath: /app/secrets/google-analytics-sa.json
      Encryption__Key: ${Encryption__Key}
      # Shared secret for the /api/external surface (consumed by project-avatar). Must match
      # the avatar's Pba__ApiKey. Fails closed (all 401) when unset.
      ExternalApi__ApiKey: ${EXTERNAL_API_KEY}
      # Drafting engine (OpenRouter, OpenAI-compatible).
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY}
      OpenRouter__Model: ${OPENROUTER_MODEL:-google/gemini-2.5-pro}
      # Hero image generation via self-hosted ComfyUI.
      ComfyUi__Enabled: ${COMFYUI_ENABLED:-false}
      ComfyUi__BaseUrl: ${COMFYUI_BASE_URL:-http://localhost:8188}
      ComfyUi__WorkflowPath: ${COMFYUI_WORKFLOW_PATH:-/app/secrets/comfyui-workflow.json}
      ComfyUi__PromptNodeId: ${COMFYUI_PROMPT_NODE_ID:-}
      ComfyUi__OutputDirectory: ${COMFYUI_OUTPUT_DIR:-/app/assets/blog-images}
      # Feed-ranking LLM scoring gate (section-12). Irreversible token spend when true.
      IdeaScoring__ScoringEnabled: ${IDEA_SCORING_ENABLED:-false}
    volumes:
      - ./secrets:/app/secrets:ro
      - ${BLOG_REPO_PATH:-./blog-repo}:/app/blog-repo:rw
