services:
  db:
    # pgvector/pgvector:pg17 (Debian/glibc) — feed-ranking needs the `vector` extension,
    # which vanilla postgres:17-alpine cannot provide. Migrated via logical pg_dump → fresh
    # volume restore (no in-place musl→glibc collation drift). See planning/feed-ranking/section-12.
    image: pgvector/pgvector:pg17
    container_name: pba-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/PBA.Api/Dockerfile
    container_name: pba-api
    ports:
      - "5001:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ApiKey: ${API_KEY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TrendMonitoring__TrendRadarApiUrl: http://trendradar:8000/api
    volumes:
      - logs:/app/logs
    networks:
      - default
      - internal
    restart: unless-stopped

  trendradar:
    image: sansan0/trendradar:0.3.0
    container_name: pba-trendradar
    profiles:
      - trendradar
    volumes:
      - trendradar_data:/data
    networks:
      - internal
    restart: unless-stopped

  web:
    build:
      context: src/PersonalBrandAssistant.Web
      dockerfile: Dockerfile
    container_name: pba-web
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  logs:
  trendradar_data:
